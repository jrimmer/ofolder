[workspace]
resolver = "3"
members = ["crates/core", "crates/adapters", "crates/portal", "crates/strip", "crates/app"]

[workspace.package]
version = "1.0.0"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/jrimmer/ofolder"
homepage = "https://github.com/jrimmer/ofolder"

# The same three lints casabon opts in to: a dropped `Result` and a file
# extension compared by hand are the mistakes that are cheap to forbid.
[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
let_underscore_must_use = "warn"
case_sensitive_file_extension_comparisons = "warn"

[workspace.dependencies]
ofolder-core = { path = "crates/core" }
ofolder-adapters = { path = "crates/adapters" }
ofolder-portal = { path = "crates/portal" }
ofolder-strip = { path = "crates/strip" }
anyhow = "1"
atspi = { version = "0.30", default-features = false, features = ["connection", "proxies"] }
async-io = "2.6"
gpui = "=0.2.2"
# The same release gpui decodes pictures with; previews are shrunk with it.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
# Pinned: gpui's xattr dependency does not build with newer libc.
libc = "=0.2.186"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1.1"
toml_edit = "0.25"
zbus = "5.19"

# gpui's renderer panics when a window's last queued Wayland event arrives after the window is
# gone; see vendor/blade-graphics/OFOLDER-PATCH.md.
[patch.crates-io]
blade-graphics = { path = "vendor/blade-graphics" }
